services:
  load_balancer:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

  redis:
    image: redis:alpine
    # Removed ports binding so it doesn't conflict with your local Redis server

  api1:
    build: .
    env_file: .env
    volumes:
      - ./prisma:/app/prisma
      - ./data:/app/data
      - ./sessions:/app/sessions   # shared session store across all instances
    environment:
      - SERVER_ROLE=API
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  api2:
    build: .
    env_file: .env
    volumes:
      - ./prisma:/app/prisma
      - ./data:/app/data
      - ./sessions:/app/sessions   # shared session store across all instances
    environment:
      - SERVER_ROLE=API
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  worker1:
    build: .
    env_file: .env
    volumes:
      - ./prisma:/app/prisma
      - ./data:/app/data
      - ./sessions:/app/sessions   # shared session store across all instances
    environment:
      - SERVER_ROLE=WORKER
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  worker2:
    build: .
    env_file: .env
    volumes:
      - ./prisma:/app/prisma
      - ./data:/app/data
      - ./sessions:/app/sessions   # shared session store across all instances
    environment:
      - SERVER_ROLE=WORKER
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

